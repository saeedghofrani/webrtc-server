version: "3.8"

services:
  webrtc-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: saeedghofrani/webrtc-server:latest
    container_name: webrtc-server
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    environment:
      PORT: "3001"
      CORS_ORIGIN: "https://meet.saeedghofranai.xyz,https://webrtc.46.249.100.50.sslip.io,https://webrtc.46.249.100.50.nip.io"
    networks:
      - webrtc

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  webrtc:
    driver: bridge
